name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project LiftLog.xcodeproj -target LiftLog -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/LiftLog.app Payload/
          zip -qry LiftLog.ipa Payload

      - name: Publish to the Releases page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ios-${{ github.run_number }}"
          gh release create "$TAG" LiftLog.ipa \
            --title "Lift Log for iPhone (build ${{ github.run_number }})" \
            --notes "Unsigned iPhone app. Install it with Sideloadly or AltStore using your Apple ID." \
            --latest=false
