<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#13161b">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Lift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a gym training log - direct, quick to use between sets
   IDEA: bumper plates - each training day gets a plate colour
   PICTURE: the workout card with set inputs, plus a rest-timer bar pinned to the bottom
   COLOUR and TYPE: charcoal/white grounds, plate colours as accents; Barlow Condensed + Barlow
   LAYOUT: header, tabs, one working column, fixed timer bar */
:root{color-scheme:light dark;--bg:light-dark(#eef0f3,#111419);--card:light-dark(#ffffff,#1a1f27);--ink:light-dark(#13161b,#eef0f3);--mute:light-dark(#596170,#9aa3b1);--line:light-dark(#d9dde3,#2a313c);--field:light-dark(#f5f6f8,#11151b);--push:#d8342c;--pull:#2a63d4;--legs:#e0a800;--ok:#1d9a5b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;letter-spacing:.01em}
header{background:light-dark(#13161b,#0a0c10);color:#f1f3f6;padding:18px max(4vw,14px) 14px}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:40px;line-height:1.05;margin:0;font-weight:800}
.sub{color:#b9c0cb;font-size:16px;margin:2px 0 0}
.strip{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:3px;margin-top:12px}
.strip button{height:30px;border:0;padding:0;border-radius:4px;display:grid;place-items:center;font:600 12px Barlow,sans-serif;color:#c9ced6;cursor:pointer}
.strip .b1{background:#3a2626}.strip .b2{background:#232f45}.strip .b3{background:#3b3420}.strip .dl{opacity:.6}
.strip .now{background:#f1f3f6;color:#13161b;opacity:1}
.strip .sel{outline:2px solid #f1f3f6;outline-offset:1px;color:#fff;opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:#b9c0cb;margin-top:6px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px;padding:6px max(4vw,14px);overflow-x:auto}
nav button,.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 16px Barlow,sans-serif;cursor:pointer;flex:none}
nav button[aria-current=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--c,var(--ink));color:#fff;border-color:transparent}
.btn.danger,.danger{color:var(--push)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pull);outline-offset:2px}
main{padding:16px max(4vw,14px) 150px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.chip{min-height:46px;padding:0 16px;border-radius:999px;border:3px solid var(--c);background:transparent;color:var(--ink);font:800 17px "Barlow Condensed",sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--c);color:#fff}
.chip.done::after{content:" \2713"}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.head h2{margin:0;font-size:30px;line-height:1.05}
.head input{width:auto;min-width:150px}
.meta{color:var(--mute);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,var(--line));border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{margin:0;font-size:22px;line-height:1.1}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tgt{font-weight:700}
.hint{font-size:14px;margin:6px 0 8px;padding:6px 10px;border-radius:6px;background:var(--field)}
.hint.up{background:light-dark(#e3f5ec,#143323);color:light-dark(#135c38,#8fe0b6)}
.sets{display:grid;grid-template-columns:2em minmax(0,1.3fr) minmax(0,1fr) minmax(0,.8fr);gap:6px 8px;align-items:center;margin-top:6px}
.sets .h{font-size:13px;color:var(--mute)}
.sets .n{font:800 18px "Barlow Condensed",sans-serif;color:var(--mute);text-align:center}
input,select,textarea{width:100%;min-height:44px;font:600 16px Barlow,sans-serif;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:0 10px}
textarea{min-height:110px;padding:10px;font:13px/1.4 ui-monospace,monospace}
.small{background:none;border:0;color:var(--mute);font:600 15px Barlow,sans-serif;min-height:40px;cursor:pointer;padding:0 4px}
.pill{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:600 15px Barlow,sans-serif;cursor:pointer}
.sug{font-size:14px;margin:6px 0 2px;padding:7px 10px;border-radius:6px;border:1px solid var(--c);background:var(--field)}
.sug b{font-size:16px}
.weeknav{display:flex;justify-content:space-between;gap:8px;margin:0 0 12px}.weeknav .btn{flex:1}
.ghost{grid-column:2/-1;font-size:13px;color:var(--mute);margin:-3px 0 4px}
.ghost.win{color:var(--ok);font-weight:700}.ghost.lose{color:var(--push)}
.race{text-align:center;font:800 22px "Barlow Condensed",sans-serif;margin:4px 0 10px}
.hint.plat{background:light-dark(#fff1dc,#3a2a12);color:light-dark(#7a4300,#ffcf8a)}
.rq{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:2px 10px;align-items:center;margin-top:12px}
.rq .meta{grid-column:2;font-size:13px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:700 17px Barlow,sans-serif;cursor:pointer}
.scale button[aria-pressed=true]{background:var(--c);color:#fff;border-color:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.hint.pain{background:light-dark(#fde8e6,#3a1714);color:light-dark(#8a1c14,#ffb3ab)}
.hint.pain.mild{background:light-dark(#fff6d6,#332a0c);color:light-dark(#6b5000,#ffe08a)}
.card.skipped{opacity:.8}.card.skipped h3{text-decoration:line-through}
.bodywrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start;margin-top:12px}
.bodymap{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.bodymap svg{display:block;width:100%;height:auto}
.pscale{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pscale button{min-height:44px;border-radius:8px;border:2px solid var(--pc);background:var(--field);color:var(--ink);font:700 17px Barlow,sans-serif;cursor:pointer}
.pscale button[aria-pressed=true]{background:var(--pc);color:#fff}
@media(max-width:600px){.bodywrap{grid-template-columns:minmax(0,1fr)}.bodymap{max-width:300px;margin:0 auto;width:100%}}
.wu{margin:8px 0 4px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
.wu summary{cursor:pointer;padding:10px 12px;font-weight:700;min-height:44px;display:flex;align-items:center}
.wurow{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);margin:0;font-weight:400;cursor:pointer}
.wurow input{width:22px;min-height:22px;flex:none}
.wurow input:checked+span{opacity:.5;text-decoration:line-through}
.report{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.rhead{display:flex;align-items:center;gap:10px}.rhead>div{flex:1;text-align:center}.rhead h2{margin:0;font-size:26px}.rhead .btn{width:48px;padding:0;font-size:22px}
.report .pr{background:var(--field)}
.focus{margin:0;padding-left:20px}.focus li{margin:4px 0}
td.up{color:var(--ok);font-weight:700}td.down{color:var(--push);font-weight:700}
.swap{margin:10px 0;padding:12px;border-radius:8px;background:var(--field);border:1px solid var(--line)}
.swap input{margin:8px 0}.swap .btn{background:var(--card)}.swap .btn.primary{background:var(--c);color:#fff}
.save{width:100%;min-height:54px;border:0;border-radius:10px;background:var(--c,var(--ink));color:#fff;font:800 22px "Barlow Condensed",sans-serif;cursor:pointer}
.note{color:var(--mute);font-size:14px;text-align:center;margin:8px 0}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--mute)}
.fig{position:relative;min-height:300px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin:12px 0}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.prs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.pr{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pr b{display:block;font:800 30px/1 "Barlow Condensed",sans-serif}
.pr span{font-size:14px;color:var(--mute)}
table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
th{color:var(--mute);font-weight:600}td.num,th.num{text-align:right;white-space:nowrap}
.hist{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.hist div{flex:1}.hist .btn{min-height:40px;padding:0 12px;font-size:15px}
label{display:block;font-weight:600;margin:14px 0 6px}
.check{display:flex;gap:10px;align-items:center;font-weight:600;margin:12px 0}.check input{width:24px;min-height:24px}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:14px 0}
.preset{text-align:left;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:10px;padding:14px;cursor:pointer;color:var(--ink);font:inherit}
.preset b{display:block;font:800 22px/1.1 "Barlow Condensed",sans-serif;margin-bottom:4px}
.preset[aria-pressed=true]{outline:3px solid var(--c);outline-offset:1px}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) 3.6em 5.2em 40px 40px;gap:6px;margin-top:6px;align-items:center}
.exrow .small{min-height:44px;font-size:18px}
.sec{margin-top:26px;padding-top:6px;border-top:1px solid var(--line)}
.sec h2{font-size:24px;margin:10px 0 0}
.tbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:light-dark(#13161b,#0a0c10);color:#f1f3f6;padding:10px max(4vw,14px) calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgb(0 0 0/.25)}
.tbar[hidden],.tbar [hidden]{display:none!important}
.tbar .wrap{display:flex;align-items:center;gap:8px;position:relative}
.tbar button{min-height:44px;min-width:48px;padding:0 12px;border-radius:8px;border:1px solid #3a414c;background:#232932;color:#f1f3f6;font:700 16px Barlow,sans-serif;cursor:pointer;flex:none}
.wclock{font:700 15px Barlow,sans-serif;color:#b9c0cb;white-space:nowrap;margin-right:auto}
.tlab{font-size:14px;color:#b9c0cb}
.trun{display:flex;align-items:center;gap:8px;width:100%;position:relative}
.tleft{font:800 38px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.ttrack{position:absolute;left:0;right:0;top:-10px;height:4px;background:#2a313c}
.tfill{height:100%;background:var(--ok);width:100%}
.tbar.alarm{background:var(--ok)}
@media(max-width:600px){h1{font-size:32px}.strip button{font-size:11px;height:28px}table{font-size:13px}.tpre .tlab{display:none}.tbar button{padding:0 9px;min-width:44px}}
@media(prefers-reduced-motion:no-preference){.chip{transition:background .15s}.tbar{transition:background .3s}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Lift Log</h1>
  <div class="sub" id="sub">Your training log</div>
  <div id="stripbox"></div>
</div></header>
<nav><div class="wrap" id="tabs">
  <button data-tab="today">Workout</button><button data-tab="program">Program</button><button data-tab="body">Body</button><button data-tab="progress">Progress</button><button data-tab="history">History</button><button data-tab="settings">Settings</button>
</div></nav>
<main><div class="wrap" id="main"></div></main>
<div class="tbar" id="tbar"><div class="wrap">
  <div class="tidle" id="tidle" style="display:flex;align-items:center;gap:6px;width:100%">
    <span class="wclock" id="wclock">Rest timer</span>
    <span class="tpre row" style="gap:6px"><span class="tlab">Rest</span><button data-rest="60">1:00</button><button data-rest="90">1:30</button><button data-rest="120">2:00</button><button data-rest="180">3:00</button></span>
  </div>
  <div class="trun" id="trun" hidden>
    <div class="ttrack"><div class="tfill" id="tfill"></div></div>
    <div style="margin-right:auto"><b class="tleft" id="tleft" aria-live="polite">1:30</b><div class="tlab" id="twhy"></div></div>
    <button data-tadj="-15" aria-label="15 seconds less">−15</button><button data-tadj="15" aria-label="15 seconds more">+15</button><button data-tstop="1">Skip</button>
  </div>
</div></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLORS=['#d8342c','#2a63d4','#e0a800','#1d9a5b','#8a4fd6','#e06a1a','#0f9fb0'];
const SESS={pushA:['Push A','#d8342c'],pullA:['Pull A','#2a63d4'],legsA:['Legs A','#e0a800'],pushB:['Push B','#d8342c'],pullB:['Pull B','#2a63d4'],legsB:['Legs B','#e0a800']};
const ORDER=['pushA','pullA','legsA','pushB','pullB','legsB'];
const B1={
 pushA:[['Bench press',4,'8–10'],['Seated DB shoulder press',3,'10–12'],['Incline DB press',3,'10–12'],['Cable lateral raise',3,'12–15'],['Triceps pushdown',3,'12–15'],['Overhead triceps extension',2,'12–15']],
 pullA:[['Barbell row',4,'8–10'],['Pull-up (weighted)',3,'8–10'],['Chest-supported DB row',3,'10–12'],['Face pull',3,'15'],['Barbell curl',3,'10–12'],['Hammer curl',2,'12']],
 legsA:[['Back squat',4,'8–10'],['Romanian deadlift',3,'10'],['Leg press',3,'12'],['Leg curl',3,'12–15'],['Standing calf raise',4,'12–15'],['Hanging leg raise',3,'12']],
 pushB:[['Overhead press',4,'8–10'],['Incline barbell press',3,'10'],['Weighted dips',3,'10–12'],['DB lateral raise',4,'15'],['Cable fly',3,'12–15'],['Skull crusher',3,'12']],
 pullB:[['Lat pulldown',4,'10–12'],['Seated cable row',3,'10–12'],['Single-arm DB row',3,'10'],['Reverse pec deck',3,'15'],['Incline DB curl',3,'12'],['Cable curl',2,'15']],
 legsB:[['Deadlift',3,'6–8'],['Bulgarian split squat (each leg)',3,'10'],['Hip thrust',3,'10–12'],['Leg extension',3,'12–15'],['Seated calf raise',4,'15'],['Cable crunch',3,'15']]};
const B2={
 pushA:[['Bench press',5,'5'],['Close-grip bench',3,'6'],['Seated DB shoulder press',3,'8–10'],['Incline barbell press',3,'8–10'],['Cable lateral raise',3,'10'],['Triceps pushdown',3,'10']],
 pullA:[['Pull-up (weighted)',5,'5'],['Pendlay row',4,'6'],['Chest-supported DB row',3,'8–10'],['Face pull',3,'12'],['EZ-bar curl',3,'8–10'],['Hammer curl',2,'10']],
 legsA:[['Back squat',5,'5'],['Pause squat',3,'4'],['Romanian deadlift',3,'8'],['Hack squat',3,'8–10'],['Leg curl',3,'10'],['Standing calf raise',4,'10']],
 pushB:[['Overhead press',5,'5'],['Weighted dips',4,'6'],['Incline barbell press',3,'8'],['DB lateral raise',4,'10–12'],['DB fly',3,'10'],['Skull crusher',3,'10']],
 pullB:[['Rack pull',4,'5'],['T-bar row',4,'6'],['Neutral-grip pulldown',3,'8–10'],['Single-arm DB row',3,'8'],['Reverse pec deck',3,'12'],['Incline DB curl',3,'10']],
 legsB:[['Deadlift',5,'3'],['Front squat',3,'6'],['Bulgarian split squat (each leg)',3,'8'],['Barbell glute bridge',3,'8'],['Leg extension',3,'10'],['Seated calf raise',4,'10']]};
const B3MAIN={pushA:'Bench press',pullA:'Pull-up (weighted)',legsA:'Back squat',pushB:'Overhead press',pullB:'Barbell row',legsB:'Deadlift'};
const B3W={11:[4,'4',8,'~85% of 1RM'],12:[4,'3',8.5,'~88% of 1RM'],13:[3,'2',9,'~91% of 1RM'],14:[3,'2, 2, 1',9,'~93%, then a ~95% single']};
const RPE={1:7,2:7.5,3:8,4:9,6:7.5,7:8,8:8.5,9:9};
const TEST={pushA:['Bench press','Overhead press'],legsA:['Back squat'],pullB:['Deadlift','Pull-up (weighted)']};
const MAIN=['Bench press','Back squat','Deadlift','Overhead press','Pull-up (weighted)','Barbell row'];
const LOWER=/squat|deadlift|leg|hip|glute|calf|rack pull|lunge/i;
const BNAME=['','Hypertrophy','Strength','Peak'];
const D=(n,c,ex)=>({n,c,ex:ex.map(([a,b,r])=>({n:a,sets:b,reps:r}))});
const PRESETS={
 ppl:{name:'Push Pull Legs · 15-week blocks',blurb:'6 days. Hypertrophy, Strength and Peak blocks with deloads, built to break plateaus.',ppl:true,periodize:true,days:ORDER.map(k=>Object.assign({k},D(SESS[k][0],SESS[k][1],B1[k])))},
 ul:{name:'Upper / Lower',blurb:'4 days. Each muscle twice a week; good for most people.',periodize:false,days:[
  D('Upper A',COLORS[0],[['Bench press',4,'6–8'],['Barbell row',4,'6–8'],['Seated DB shoulder press',3,'8–10'],['Lat pulldown',3,'8–10'],['Barbell curl',2,'10–12'],['Triceps pushdown',2,'10–12']]),
  D('Lower A',COLORS[2],[['Back squat',4,'6–8'],['Romanian deadlift',3,'8–10'],['Leg press',3,'10–12'],['Leg curl',3,'10–12'],['Standing calf raise',4,'10–15']]),
  D('Upper B',COLORS[1],[['Overhead press',4,'6–8'],['Pull-up (weighted)',4,'6–8'],['Incline DB press',3,'8–10'],['Seated cable row',3,'10–12'],['DB lateral raise',3,'12–15'],['Hammer curl',2,'10–12']]),
  D('Lower B',COLORS[3],[['Deadlift',3,'5'],['Front squat',3,'6–8'],['Bulgarian split squat (each leg)',3,'8–10'],['Leg extension',3,'12–15'],['Seated calf raise',4,'12–15'],['Hanging leg raise',3,'12']])]},
 fb:{name:'Full Body',blurb:'3 days. Best for beginners or a busy schedule.',periodize:false,days:[
  D('Full Body A',COLORS[0],[['Back squat',3,'5–8'],['Bench press',3,'5–8'],['Barbell row',3,'6–10'],['Overhead triceps extension',2,'10–12'],['Standing calf raise',3,'10–15']]),
  D('Full Body B',COLORS[1],[['Deadlift',3,'5'],['Overhead press',3,'6–8'],['Lat pulldown',3,'8–10'],['Walking lunge',2,'10'],['Barbell curl',2,'10–12']]),
  D('Full Body C',COLORS[2],[['Front squat',3,'6–8'],['Incline DB press',3,'8–10'],['Chest-supported DB row',3,'8–10'],['Hip thrust',3,'8–12'],['Cable lateral raise',2,'12–15']])]},
 bro:{name:'Body-Part Split',blurb:'5 days. One muscle group per day, lots of volume.',periodize:false,days:[
  D('Chest',COLORS[0],[['Bench press',4,'6–8'],['Incline DB press',3,'8–10'],['Weighted dips',3,'8–12'],['Cable fly',3,'12–15']]),
  D('Back',COLORS[1],[['Deadlift',3,'5'],['Pull-up (weighted)',3,'6–10'],['Barbell row',3,'8–10'],['Lat pulldown',3,'10–12'],['Face pull',3,'15']]),
  D('Legs',COLORS[2],[['Back squat',4,'6–8'],['Leg press',3,'10–12'],['Romanian deadlift',3,'8–10'],['Leg curl',3,'12'],['Standing calf raise',4,'12–15']]),
  D('Shoulders',COLORS[5],[['Overhead press',4,'6–8'],['DB lateral raise',4,'12–15'],['Reverse pec deck',3,'15'],['DB shrug',3,'10–12']]),
  D('Arms',COLORS[4],[['Barbell curl',3,'8–12'],['Close-grip bench',3,'6–10'],['Incline DB curl',3,'10–12'],['Skull crusher',3,'10–12'],['Hammer curl',2,'12'],['Triceps pushdown',2,'12–15']])]},
 custom:{name:'Build my own',blurb:'Start with one empty day and add your own exercises.',periodize:false,days:[D('Day 1',COLORS[0],[])]}};
const newKey=()=>'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function fromPreset(id){const p=JSON.parse(JSON.stringify(PRESETS[id]));p.preset=id;delete p.blurb;p.days.forEach(d=>{if(!d.k)d.k=newKey()});return p}
const ALTS=[

let ro=null;
function mountChart(pts){

    g+=`<text x="${L}" y="${H-8}" font-size="12" fill="var(--mute)">${fmtD(pts[0].date)}</text><text x="${W-R}" y="${H-8}" text-anchor="end" font-size="12" fill="var(--mute)">${fmtD(pts[pts.length-1].date)}</text>`;
    g+=`<polyline fill="none" stroke="var(--push)" stroke-width="3" stroke-linejoin="round" points="${pts.map((p,i)=>X(xs[i])+','+Y(p.v)).join(' ')}"/>`;
    g+=pts.map((p,i)=>`<circle cx="${X(xs[i])}" cy="${Y(p.v)}" r="${W<520?3:4.5}" fill="var(--card)" stroke="var(--push)" stroke-width="2.5"/>`).join('');

const T={end:0,dur:0,alarmUntil:0,start:0,base:0,i:null,k:null,why:''};

}

  if(t.id==='lift'){view.lift=t.value;render()}
  if(t.dataset.pe){const [di,ei]=t.dataset.pe.split('.').map(Number),f=t.dataset.pf;let v=t.value.trim();
    editProg(p=>{const ex=p.days[di].ex[ei];if(f==='n'){if(v)ex.n=v.slice(0,60)}else if(f==='sets'){const n=parseInt(v,10);if(n>0)ex.sets=Math.min(10,n)}else{if(/\d/.test(v))ex.reps=v.slice(0,12)}})}
  if(t.dataset.pd){const di=+t.dataset.pd,v=t.value.trim().slice(0,30);if(v)editProg(p=>{p.days[di].n=v})}
  if(t.id==='sper'){view.per=t.checked}
  if(t.id==='per')editProg(p=>{p.periodize=t.checked});
  if(t.id==='start'&&t.value){putProfile({start:t.value})}
  if(t.id==='unit')putProfile({unit:t.value});
  if(t.id==='gbar'||t.id==='gpl'){const b=parseFloat($('#gbar').value),pl=$('#gpl').value.split(/[,\s]+/).map(Number).filter(v=>v>0&&v<=100);const G=Object.assign({},(S.profile&&S.profile.gear)||{});G[unit()]={bar:b>0&&b<=60?b:GEAR[unit()].bar,plates:pl.length?[...new Set(pl)].sort((a,c)=>c-a):GEAR[unit()].plates};putProfile({gear:G})}
  if(t.dataset.wu){view.wu=Object.assign({},view.wu,{[t.dataset.wu]:t.checked})}
  if(t.id==='rpedef')putProfile({rpeDef:+t.value});
  if(['tauto','tsound','tadapt','trest','tmain'].includes(t.id)){const x=tm();x.auto=$('#tauto').checked;x.sound=$('#tsound').checked;x.adapt=$('#tadapt').checked;x.rest=Math.min(600,Math.max(15,+$('#trest').value||90));x.main=Math.min(900,Math.max(15,+$('#tmain').value||180));putProfile({timer:x})}
});
$('#main').addEventListener('click',async e=>{
  const spot=e.target.closest('[data-pk]');if(spot){view.painSel=spot.dataset.pk;render();return}
  const b=e.target.closest('button');if(!b)return;unfocus();
  if(b.dataset.pl!=null){await setPain(view.painSel,+b.dataset.pl);return}
  if(b.dataset.pdone){view.painSel=null;render();return}
  if(b.dataset.pedit){view.painSel=b.dataset.pedit;render();return}
  if(b.dataset.pclear){if(view.painSel===b.dataset.pclear)view.painSel=null;await setPain(b.dataset.pclear,0);return}
  if(b.dataset.wnav){flush();const d=new Date(view.date+'T00:00');d.setDate(d.getDate()+(+b.dataset.wnav));view.date=iso(d);view.swap=null;render();return}
  if(b.dataset.wtoday){flush();view.date=iso(today());view.k=null;view.swap=null;render();return}
  if(b.dataset.rw){view.rw=Math.max(1,+b.dataset.rw);render();return}
  if(b.dataset.report){flush();view.rw=+b.dataset.report;view.tab='progress';render();return}
  if(b.dataset.gobody){flush();view.tab='body';render();return}
  if(b.dataset.pover){flush();painOver[b.dataset.pover]=true;render();return}
  if(b.dataset.pick){view.pick=b.dataset.pick;view.per=null;render();return}
  if(b.id==='go'){const id=view.pick||'ul',p=fromPreset(id);if(!p.ppl){const c=$('#sper');p.periodize=!!(c&&c.checked)}const u=$('#su').value;view.k=null;await putProfile({program:p,unit:u,start:monday()});view.tab=id==='custom'?'program':'today';render();return}
  if(b.dataset.rk){view.rd=Object.assign({},view.rd,{[b.dataset.rk]:+b.dataset.rv});render();return}
  if(b.dataset.rsave){const r=view.rd||{};if(r.sl&&r.so&&r.en){view.rd=null;await putProfile({ready:{date:view.date,sl:r.sl,so:r.so,en:r.en}})}return}
  if(b.dataset.rskip){view.rdSkip=true;render();return}
  if(b.dataset.rchange){const r=readyToday();view.rd=r?{sl:r.sl,so:r.so,en:r.en}:{};view.rdSkip=false;await putProfile({ready:null});return}
  if(b.dataset.bo!=null){const k=sidFor(view.date,view.k)+'|'+curPlan()[+b.dataset.bo].n;backoff[k]=true;render();return}
  if(b.dataset.dl!=null){const k=sidFor(view.date,view.k)+'|'+curPlan()[+b.dataset.dl].n;deloadNow[k]=!deloadNow[k];render();return}
  if(b.dataset.s){flush();view.k=b.dataset.s;view.swap=null;flash='';render();return}
  if(b.dataset.swap!=null){flush();view.swap=view.swap===+b.dataset.swap?null:+b.dataset.swap;render();return}
  if(b.dataset.swapcancel){view.swap=null;render();return}
  if(b.dataset.swapgo!=null||b.dataset.swapreset!=null){
    flush();const i=+(b.dataset.swapgo!=null?b.dataset.swapgo:b.dataset.swapreset),x=curPlan()[i],base=x.orig||x.n;
    const name=b.dataset.swapgo!=null?(($('#swcustom').value||'').trim().slice(0,60)||$('#swsel').value):base;
    const id=sidFor(view.date,view.k);if(draft[id]&&draft[id][x.n]){draft[id][name]=draft[id][x.n];delete draft[id][x.n]}
    view.swap=null;flash='';
    if(prog().ppl&&B1[view.k]){const sw=Object.assign({},swaps()),key=view.k+'|'+base;if(name!==base)sw[key]=name;else delete sw[key];await putProfile({swaps:sw})}
    else{const di=prog().days.findIndex(d=>d.k===view.k);if(di>-1&&name)await editProg(p=>{const ex=p.days[di].ex.find(z=>z.n===x.n);if(ex)ex.n=name})}
    return}
  if(b.dataset.add!=null){const id=sidFor(view.date,view.k),n=curPlan()[+b.dataset.add].n;const x=(extra[id]=extra[id]||{});x[n]=(x[n]||0)+1;render();return}
  if(b.dataset.open){const d=S.sessions[b.dataset.open];if(d){view.date=d.date;view.k=d.s;view.tab='today';render()}return}
  if(b.dataset.del){if(armed===b.dataset.del){armed=null;await delSession(b.dataset.del)}else{armed=b.dataset.del;render()}return}
  if(b.dataset.padd){const di=+b.dataset.padd;await editProg(p=>{p.days[di].ex.push({n:'New exercise',sets:3,reps:'8–12'})});return}
  if(b.dataset.pxdel){const [di,ei]=b.dataset.pxdel.split('.').map(Number);await editProg(p=>{p.days[di].ex.splice(ei,1)});return}
  if(b.dataset.pup){const [di,ei]=b.dataset.pup.split('.').map(Number);if(ei>0)await editProg(p=>{const a=p.days[di].ex;[a[ei-1],a[ei]]=[a[ei],a[ei-1]]});return}
  if(b.dataset.pdel){const di=+b.dataset.pdel;if(armed==='day'+di){armed=null;const k=prog().days[di].k;await editProg(p=>{p.days.splice(di,1)});if(view.k===k)view.k=null;render()}else{armed='day'+di;render()}return}
  if(b.dataset.pdayadd){await editProg(p=>{p.days.push({k:newKey(),n:'Day '+(p.days.length+1),c:COLORS[p.days.length%COLORS.length],ex:[]})});return}
  if(b.id==='swp'){if(armed==='swp'){armed=null;const id=$('#newp').value;view.k=null;await putProfile({program:fromPreset(id),swaps:{}});flash='Program switched.';render()}else{armed='swp';render()}return}
  if(b.id==='copy'){const txt=JSON.stringify(S);const io=$('#io');io.value=txt;try{await navigator.clipboard.writeText(txt);b.textContent='Copied'}catch(err){io.focus();io.select();b.textContent='Copy the text below'}return}
  if(b.id==='imp'){let j;try{j=JSON.parse($('#io').value)}catch(err){flash='That backup text is not valid.';armed=null;render();return}
    if(!j||typeof j!=='object'||!j.sessions){flash='That backup text is not valid.';armed=null;render();return}
    if(armed!=='imp'){armed='imp';b.textContent='Confirm restore';return}
    armed=null;const ss=j.sessions;for(const [k,v] of Object.entries(ss)){if(v&&v.date&&v.ex)await putSession(k,v)}if(j.profile)await putProfile(j.profile);flash='Backup restored.';render();return}
  if(b.id==='save'){
    clearTimeout(asTimer);asTimer=null;const ex=collect();
    if(!Object.keys(ex).length){flash='Enter reps for at least one set first.';render();return}
    const [id,doc]=sessionDoc(ex);delete draft[id];delete extra[id];flash='Saved.';T.end=0;
    await putSession(id,doc);
  }
});

render();

(async()=>{
  try{
    if(!booting)return;
    const done=()=>{booting=false;render()};
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return done();const uid=await user.id();if(!uid)return done();
    profRef=db.doc('data/users/'+uid+'/profile');mode='db';status='Synced to your account, on every device.';
    const local=JSON.parse(JSON.stringify(S));let gotProf=false,gotSess=false;
    const ready=()=>{if(gotProf&&gotSess&&booting){booting=false}};
    const timer=setTimeout(()=>{if(!loaded){slow=true;booting=false;render()}},10000);
    profRef.onSnapshot(sn=>{if(sn.exists)S.profile=sn.data();else if(!local.profile)S.profile=null;if(!sn.metadata.fromCache)gotProf=true;ready();render()},()=>{gotProf=true;ready();render()});
    profRef.collection('sessions').onSnapshot(q=>{
      const o={};q.docs.forEach(d=>{o[d.id]=d.data()});
      if(!q.metadata.fromCache&&!loaded){loaded=true;slow=false;gotSess=true;clearTimeout(timer);
        if(q.empty&&Object.keys(local.sessions).length){for(const [k,v] of Object.entries(local.sessions)){o[k]=v;profRef.collection('sessions').doc(k).set(v).catch(()=>{})}if(local.profile)profRef.set(local.profile).catch(()=>{})}}
      S.sessions=o;ready();render()},
      ()=>{clearTimeout(timer);mode='local';booting=false;status='Sync unavailable; saving on this device only.';render()});
  }catch(e){booting=false;render()}
})();
}
