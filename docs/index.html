<head>

<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<title>Lift Log</title>

<style>
/* VOICE: a gym training log - direct, quick to use between sets
   IDEA: bumper plates - each training day gets a plate colour
   PICTURE: the workout card with set inputs, plus a rest-timer bar pinned to the bottom
   COLOUR and TYPE: charcoal/white grounds, plate colours as accents; Barlow Condensed + Barlow
   LAYOUT: header, tabs, one working column, fixed timer bar */
:root{color-scheme:light dark;--bg:light-dark(#eef0f3,#111419);--card:light-dark(#ffffff,#1a1f27);--ink:light-dark(#13161b,#eef0f3);--mute:light-dark(#596170,#9aa3b1);--line:light-dark(#d9dde3,#2a313c);--field:light-dark(#f5f6f8,#11151b);--push:#d8342c;--pull:#2a63d4;--legs:#e0a800;--ok:#1d9a5b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;letter-spacing:.01em}
header{background:light-dark(#13161b,#0a0c10);color:#f1f3f6;padding:18px max(4vw,14px) 14px}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:40px;line-height:1.05;margin:0;font-weight:800}
.sub{color:#b9c0cb;font-size:16px;margin:2px 0 0}
.strip{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:3px;margin-top:12px}
.strip button{height:30px;border:0;padding:0;border-radius:4px;display:grid;place-items:center;font:600 12px Barlow,sans-serif;color:#c9ced6;cursor:pointer}
.strip .b1{background:#3a2626}.strip .b2{background:#232f45}.strip .b3{background:#3b3420}.strip .dl{opacity:.6}
.strip .now{background:#f1f3f6;color:#13161b;opacity:1}
.strip .sel{outline:2px solid #f1f3f6;outline-offset:1px;color:#fff;opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:#b9c0cb;margin-top:6px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px;padding:6px max(4vw,14px);overflow-x:auto}
nav button,.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 16px Barlow,sans-serif;cursor:pointer;flex:none}
nav button[aria-current=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--c,var(--ink));color:#fff;border-color:transparent}
.btn.danger,.danger{color:var(--push)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pull);outline-offset:2px}
main{padding:16px max(4vw,14px) 150px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.chip{min-height:46px;padding:0 16px;border-radius:999px;border:3px solid var(--c);background:transparent;color:var(--ink);font:800 17px "Barlow Condensed",sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--c);color:#fff}
.chip.done::after{content:" \2713"}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.head h2{margin:0;font-size:30px;line-height:1.05}
.head input{width:auto;min-width:150px}
.meta{color:var(--mute);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,var(--line));border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{margin:0;font-size:22px;line-height:1.1}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tgt{font-weight:700}
.hint{font-size:14px;margin:6px 0 8px;padding:6px 10px;border-radius:6px;background:var(--field)}
.hint.up{background:light-dark(#e3f5ec,#143323);color:light-dark(#135c38,#8fe0b6)}
.sets{display:grid;grid-template-columns:2em minmax(0,1.3fr) minmax(0,1fr) minmax(0,.8fr);gap:6px 8px;align-items:center;margin-top:6px}
.sets .h{font-size:13px;color:var(--mute)}
.sets .n{font:800 18px "Barlow Condensed",sans-serif;color:var(--mute);text-align:center}
input,select,textarea{width:100%;min-height:44px;font:600 16px Barlow,sans-serif;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:0 10px}
textarea{min-height:110px;padding:10px;font:13px/1.4 ui-monospace,monospace}
.small{background:none;border:0;color:var(--mute);font:600 15px Barlow,sans-serif;min-height:40px;cursor:pointer;padding:0 4px}
.pill{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:600 15px Barlow,sans-serif;cursor:pointer}
.sug{font-size:14px;margin:6px 0 2px;padding:7px 10px;border-radius:6px;border:1px solid var(--c);background:var(--field)}
.sug b{font-size:16px}
.weeknav{display:flex;justify-content:space-between;gap:8px;margin:0 0 12px}.weeknav .btn{flex:1}
.ghost{grid-column:2/-1;font-size:13px;color:var(--mute);margin:-3px 0 4px}
.ghost.win{color:var(--ok);font-weight:700}.ghost.lose{color:var(--push)}
.race{text-align:center;font:800 22px "Barlow Condensed",sans-serif;margin:4px 0 10px}
.hint.plat{background:light-dark(#fff1dc,#3a2a12);color:light-dark(#7a4300,#ffcf8a)}
.rq{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:2px 10px;align-items:center;margin-top:12px}
.rq .meta{grid-column:2;font-size:13px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:700 17px Barlow,sans-serif;cursor:pointer}
.scale button[aria-pressed=true]{background:var(--c);color:#fff;border-color:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.hint.pain{background:light-dark(#fde8e6,#3a1714);color:light-dark(#8a1c14,#ffb3ab)}
.hint.pain.mild{background:light-dark(#fff6d6,#332a0c);color:light-dark(#6b5000,#ffe08a)}
.card.skipped{opacity:.8}.card.skipped h3{text-decoration:line-through}
.bodywrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start;margin-top:12px}
.bodymap{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.bodymap svg{display:block;width:100%;height:auto}
.pscale{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pscale button{min-height:44px;border-radius:8px;border:2px solid var(--pc);background:var(--field);color:var(--ink);font:700 17px Barlow,sans-serif;cursor:pointer}
.pscale button[aria-pressed=true]{background:var(--pc);color:#fff}
@media(max-width:600px){.bodywrap{grid-template-columns:minmax(0,1fr)}.bodymap{max-width:300px;margin:0 auto;width:100%}}
.wu{margin:8px 0 4px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
.wu summary{cursor:pointer;padding:10px 12px;font-weight:700;min-height:44px;display:flex;align-items:center}
.wurow{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);margin:0;font-weight:400;cursor:pointer}
.wurow input{width:22px;min-height:22px;flex:none}
.wurow input:checked+span{opacity:.5;text-decoration:line-through}
.report{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.rhead{display:flex;align-items:center;gap:10px}.rhead>div{flex:1;text-align:center}.rhead h2{margin:0;font-size:26px}.rhead .btn{width:48px;padding:0;font-size:22px}
.report .pr{background:var(--field)}
.focus{margin:0;padding-left:20px}.focus li{margin:4px 0}
td.up{color:var(--ok);font-weight:700}td.down{color:var(--push);font-weight:700}
.swap{margin:10px 0;padding:12px;border-radius:8px;background:var(--field);border:1px solid var(--line)}
.swap input{margin:8px 0}.swap .btn{background:var(--card)}.swap .btn.primary{background:var(--c);color:#fff}
.save{width:100%;min-height:54px;border:0;border-radius:10px;background:var(--c,var(--ink));color:#fff;font:800 22px "Barlow Condensed",sans-serif;cursor:pointer}
.note{color:var(--mute);font-size:14px;text-align:center;margin:8px 0}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--mute)}
.fig{position:relative;min-height:300px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin:12px 0}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.prs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.pr{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pr b{display:block;font:800 30px/1 "Barlow Condensed",sans-serif}
.pr span{font-size:14px;color:var(--mute)}
table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
th{color:var(--mute);font-weight:600}td.num,th.num{text-align:right;white-space:nowrap}
.hist{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.hist div{flex:1}.hist .btn{min-height:40px;padding:0 12px;font-size:15px}
label{display:block;font-weight:600;margin:14px 0 6px}
.check{display:flex;gap:10px;align-items:center;font-weight:600;margin:12px 0}.check input{width:24px;min-height:24px}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:14px 0}
.preset{text-align:left;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:10px;padding:14px;cursor:pointer;color:var(--ink);font:inherit}
.preset b{display:block;font:800 22px/1.1 "Barlow Condensed",sans-serif;margin-bottom:4px}
.preset[aria-pressed=true]{outline:3px solid var(--c);outline-offset:1px}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) 3.6em 5.2em 40px 40px;gap:6px;margin-top:6px;align-items:center}
.exrow .small{min-height:44px;font-size:18px}
.sec{margin-top:26px;padding-top:6px;border-top:1px solid var(--line)}
.sec h2{font-size:24px;margin:10px 0 0}
.tbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:light-dark(#13161b,#0a0c10);color:#f1f3f6;padding:10px max(4vw,14px) calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgb(0 0 0/.25)}
.tbar[hidden],.tbar [hidden]{display:none!important}
.tbar .wrap{display:flex;align-items:center;gap:8px;position:relative}
.tbar button{min-height:44px;min-width:48px;padding:0 12px;border-radius:8px;border:1px solid #3a414c;background:#232932;color:#f1f3f6;font:700 16px Barlow,sans-serif;cursor:pointer;flex:none}
.wclock{font:700 15px Barlow,sans-serif;color:#b9c0cb;white-space:nowrap;margin-right:auto}
.tlab{font-size:14px;color:#b9c0cb}
.trun{display:flex;align-items:center;gap:8px;width:100%;position:relative}
.tleft{font:800 38px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.ttrack{position:absolute;left:0;right:0;top:-10px;height:4px;background:#2a313c}
.tfill{height:100%;background:var(--ok);width:100%}
.tbar.alarm{background:var(--ok)}
@media(max-width:600px){h1{font-size:32px}.strip button{font-size:11px;height:28px}table{font-size:13px}.tpre .tlab{display:none}.tbar button{padding:0 9px;min-width:44px}}
@media(prefers-reduced-motion:no-preference){.chip{transition:background .15s}.tbar{transition:background .3s}}

/* ---------- polish pass ---------- */
.hero{background:var(--c);color:#fff;border-radius:18px;padding:16px;margin:0 0 12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:22px solid rgb(255 255 255/.12)}
.hero h2{margin:2px 0 0;font-size:34px;line-height:1.05;position:relative}
.eyebrow{font:700 14px Barlow,sans-serif;opacity:.9;display:flex;align-items:center;gap:6px;position:relative}
.eyebrow .dot{width:9px;height:9px;border-radius:50%;background:#fff}
@media(prefers-reduced-motion:no-preference){.eyebrow .dot{animation:pulse 1.6s ease-in-out infinite}}
.hmeta{font-size:15px;opacity:.92;margin-top:4px;position:relative;font-variant-numeric:tabular-nums}
.hlist{display:grid;gap:8px;margin-top:12px;position:relative}
.hx{display:flex;align-items:center;gap:10px}.hx b{display:block;font-size:16px;line-height:1.2}.hx .meta{color:inherit;opacity:.85;font-size:13px}
.hero .thumb{width:44px!important;height:44px!important;border:0;background:rgb(255 255 255/.15)}
.hero .thumb .xfig{color:#fff}.hero .thumb .xfig .eq{stroke:#fff}.hero .thumb .xfig .pl{fill:#fff}
.herobtn{min-height:48px;padding:0 20px;border:0;border-radius:12px;background:#fff;color:#13161b;font:800 19px "Barlow Condensed",Barlow,sans-serif;cursor:pointer;position:relative}
.herobtn.ghostbtn{background:rgb(255 255 255/.16);color:#fff}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.hct{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}.hct b{font:800 20px "Barlow Condensed",Barlow,sans-serif}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px}
.wd.today{background:var(--field);outline:2px solid var(--ink);outline-offset:-2px}
.wd.future{opacity:.55}
.wl{font-size:12px;color:var(--mute)}.wn{font:700 17px Barlow,sans-serif}
.wdots{display:flex;gap:3px;height:9px}.wdots i{width:9px;height:9px;border-radius:50%}.wdots i.none{background:var(--line);width:5px;height:5px;margin-top:2px}
.hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.hstats div{display:flex;flex-direction:column}.hstats b{font:800 26px/1 "Barlow Condensed",Barlow,sans-serif;font-variant-numeric:tabular-nums}.hstats span{font-size:13px;color:var(--mute);margin-top:3px}
.bar15{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:3px}
.bar15 i{height:10px;border-radius:3px;opacity:.35}.bar15 i.b1{background:#d8342c}.bar15 i.b2{background:#2a63d4}.bar15 i.b3{background:#e0a800}
.bar15 i.past{opacity:.9}.bar15 i.now{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.hpr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.hpr:first-of-type{border-top:0}
.hpr>span:nth-child(2){flex:1;display:flex;flex-direction:column}.hpr .thumb{width:44px!important;height:44px!important}
.hpr .up{color:var(--ok);font:800 18px Barlow,sans-serif}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.htile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:84px;display:flex;flex-direction:column;gap:4px;color:var(--ink);font:inherit;cursor:pointer}
.htile b{font:800 19px "Barlow Condensed",Barlow,sans-serif}.htile .meta{font-size:13px;line-height:1.3}
.thumb{width:56px!important;height:56px!important;padding:0!important;overflow:hidden}
.thumb .ph{display:block;width:100%;height:100%;object-fit:cover}
.thumb .xfig{padding:3px}
.cmp .big{aspect-ratio:4/3!important;max-width:170px!important;padding:0!important;overflow:hidden;position:relative}
.cmp .big .xfig{padding:6px}
.phanim{position:absolute;inset:0}
.phanim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media(prefers-reduced-motion:no-preference){.phanim .f2{animation:frame 2.6s ease-in-out infinite}@keyframes frame{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}}
@media(prefers-reduced-motion:reduce){.phanim .f2{display:none}}
main{padding-bottom:110px!important}body.timing main{padding-bottom:190px!important}
.tidle .wclock{font:800 22px "Barlow Condensed",Barlow,sans-serif;color:#fff}
.xfig{display:block;width:100%;height:100%;color:var(--ink)}
.xfig .eq{stroke:var(--c);stroke-width:2.6}.xfig .pl{fill:var(--c);stroke:none}.xfig .fl{stroke:var(--line);stroke-width:2}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;margin:0 0 10px}
.cmp figure{margin:0;text-align:center}
.cmp .big{width:100%;max-width:128px;aspect-ratio:1;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px}
.cmp figcaption{font-size:13px;color:var(--mute);margin-top:6px;line-height:1.25}
.cmp .arrow{font:800 24px Barlow,sans-serif;color:var(--mute)}
.thumb{flex:none;width:48px;height:48px;border-radius:10px;background:var(--field);border:1px solid var(--line);padding:3px;display:block}
.ddwrap{position:relative}
.dd{width:100%;display:flex;align-items:center;gap:10px;min-height:62px;padding:6px 10px;border:2px solid var(--c);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.dd .chev{margin-left:auto;flex:none;color:var(--mute)}
@media(prefers-reduced-motion:no-preference){.dd .chev{transition:transform .15s}}
.dd[aria-expanded=true] .chev{transform:rotate(180deg)}
.ddtext{display:flex;flex-direction:column;line-height:1.2;min-width:0}.ddtext b{font-size:16px}.ddtext .meta{font-size:13px}
.ddlist{margin-top:6px;border:1px solid var(--line);border-radius:12px;background:var(--card);max-height:330px;overflow:auto;box-shadow:0 8px 24px rgb(0 0 0/.18)}
.ddlist button{width:100%;display:flex;align-items:center;gap:10px;padding:6px 10px;min-height:60px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.ddlist button:last-child{border-bottom:0}
.ddlist button[aria-selected=true]{background:color-mix(in srgb,var(--c) 12%,transparent)}
.ddlist .tick{margin-left:auto;color:var(--c);font-weight:800}
.swap #swcustom{margin:8px 0 0}
.startbtn{width:100%;min-height:54px;margin:0 0 12px;border:0;border-radius:14px;background:var(--c);color:#fff;font:800 22px "Barlow Condensed",Barlow,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.stp.live{background:light-dark(#e3f5ec,#143323);color:light-dark(#135c38,#8fe0b6);border-color:transparent;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.stp .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
@media(prefers-reduced-motion:no-preference){.stp .dot{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}}
.livetag{color:var(--ok)}
body{font-family:Barlow,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
header{padding:14px max(4vw,14px) 12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:28px}
.sub{font-size:14px;color:#aeb6c2;margin-top:3px;line-height:1.35}.sub b{color:#f1f3f6;font-weight:600}
.gear{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid #2a313c;background:#1b2029;color:#d5dae1;display:grid;place-items:center;cursor:pointer}
.gear[aria-current=true]{background:#f1f3f6;color:#13161b}
.strip{margin-top:12px;gap:2px}
.strip button{height:24px;font-size:11px;border-radius:3px}
.blocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin-top:5px;font-size:12px;color:#9aa3b1}

  {const td=today().getDay(),cw=wOf(iso(today())),rw=td===0?cw:cw-1;if((td===0||td===1)&&rw>=1&&isToday&&Object.values(S.sessions).some(d=>wOf(d.date)===rw))st.push(`<button class="stp good" data-report="${rw}">Week ${prog().periodize?wkOf(rw):rw} report ready →</button>`)}

/* ================= 3D body for the pain map (hand-written WebGL, no library) ================= */
// Body space: metres, feet at y=0, facing +z. The person's RIGHT side is at x<0 (as seen from the front).
// Region index -> pain key (AREAS key + side).
const B3REG=['head','neck','chest','back','abs','lowback',
 'shoulder-R','shoulder-L','upperarm-R','upperarm-L','elbow-R','elbow-L','forearm-R','forearm-L','wrist-R','wrist-L','hand-R','hand-L',
 'hip-R','hip-L','quad-R','quad-L','hamstring-R','hamstring-L','knee-R','knee-L','calf-R','calf-L','ankle-R','ankle-L','foot-R','foot-L'];
// Part kinds: 0 head 1 neck 2 upper torso 3 lower torso 4 pelvis 5 shoulder 6 upper arm 7 elbow 8 forearm 9 wrist 10 hand 11 thigh 12 knee 13 shin 14 ankle 15 foot
const v3={sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
 cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],len:a=>Math.hypot(a[0],a[1],a[2]),norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]}};

const LB_PER_KG=2.20462;
const bwRaw=()=>{const a=S.profile&&S.profile.bw;return Array.isArray(a)?a:[]};
const bwU=e=>e&&e.u==='kg'?'kg':'lb';
const bwConv=(w,from)=>{const u=unit();w=+w;return from===u?w:u==='kg'?w/LB_PER_KG:w*LB_PER_KG};
const bwList=()=>bwRaw().filter(e=>e&&/^\d{4}-\d\d-\d\d$/.test(e.d)&&+e.w>0).slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);

const bwF=v=>(Math.round(v*10)/10).toFixed(1);

const bwRange=()=>unit()==='kg'?[14,318]:[30,700];
function bwStats(){
  const td0=iso(today()),L=bwList().filter(e=>e.d<=td0).map(e=>({d:e.d,w:bwConv(e.w,bwU(e))}));// weigh-ins dated after today (other clock, restored backup) stay stored but are ignored
  let t=null;for(const e of L){t=t==null?e.w:t+0.1*(e.w-t);e.t=t}
  const td=iso(today()),n0=dayN(td),win=L.filter(e=>{const k=n0-dayN(e.d);return k>=0&&k<=13});
  let rate=null;
  if(win.length>=4&&dayN(win[win.length-1].d)-dayN(win[0].d)>=7){
    const xs=win.map(e=>dayN(e.d)),mx=xs.reduce((a,b)=>a+b,0)/xs.length,my=win.reduce((a,e)=>a+e.w,0)/win.length;
    let sxy=0,sxx=0;win.forEach((e,i)=>{sxy+=(xs[i]-mx)*(e.w-my);sxx+=(xs[i]-mx)**2});
    const wk=7*sxy/sxx,pct=wk/my*100,loss=-pct;
    const cls=loss>1?'pain':loss>0.75?'warn':loss>=0.25?'good':'';
    const lab=cls==='pain'?'Very fast: strength may drop':cls==='warn'?'Fast: watch your main lifts':cls==='good'?'Steady, strength-friendly loss':pct>=0.25?'Gaining':'About steady';
    const sg=wk<0&&Math.abs(wk)>=0.05?'−':wk>=0.05?'+':'';
    rate={wk,pct,cls,lab,txt:`${sg}${Math.abs(wk).toFixed(1)} ${unit()}/wk`,ptxt:`${sg==='+'?'+':''}${Math.abs(pct).toFixed(2)}%/wk`}}
  return {L,trend:t,rate,todayE:L.find(e=>e.d===td)};
}

const T={end:0,dur:0,alarmUntil:0,start:0,base:0,i:null,k:null,why:''};
let ac=null;
document.addEventListener('pointerdown',()=>{try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();else if(ac.state==='suspended')ac.resume()}catch(e){}},{passive:true});
function beep(){
  if(!tm().sound)return;
  try{if(ac){const t0=ac.currentTime;for(let i=0;i<3;i++){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=i===2?1320:880;g.gain.setValueAtTime(0.0001,t0+i*.28);g.gain.exponentialRampToValueAtTime(0.35,t0+i*.28+.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+i*.28+.22);o.connect(g).connect(ac.destination);o.start(t0+i*.28);o.stop(t0+i*.28+.25)}}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([250,120,250,120,400])}catch(e){}
}
function startRest(sec,m){T.dur=Math.max(5,sec);T.start=Date.now();T.end=T.start+T.dur*1000;T.alarmUntil=0;T.base=m?m.base:sec;T.i=m?m.i:null;T.k=m?m.k:null;T.why=m?m.why:'';tick()}
function tick(){
  const bar=$('#tbar'),now=Date.now(),running=T.end>now;
  if(T.end&&!running){T.end=0;T.alarmUntil=now+4000;beep()}
  const alarm=T.alarmUntil>now;
  bar.classList.toggle('alarm',alarm);
  $('#trun').hidden=!running;$('#tidle').style.display=running?'none':'flex';
  if(running){const left=(T.end-now)/1000;$('#tleft').textContent=mmss(Math.ceil(left));$('#twhy').textContent=T.why;$('#tfill').style.width=Math.max(0,Math.min(100,left/T.dur*100))+'%'}
  let clock='Rest over. Next set!';
  {const L=liveSess();if(L){const age=now-L[1].start;const hl=document.getElementById('homelive');if(hl)hl.textContent=mmss(age/1000);const wl=document.getElementById('wlive');if(wl&&age<=4*36e5)wl.textContent='In progress '+mmss(age/1000)}}
  const wc=$('#wclock');if(wc.textContent!==clock)wc.textContent=clock;
  bar.hidden=needsSetup()||(!running&&!alarm);
  document.body.classList.toggle('timing',!bar.hidden);
}
setInterval(tick,250);

  tick:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  l:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  r:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>'};
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const fieldLabel=el=>{const l=el.id&&document.querySelector(`label[for="${el.id}"]`);return ((l&&l.textContent)||el.getAttribute('aria-label')||'').trim()};
const fmtCD=(v,long)=>{if(!v)return '';const d=new Date(v+'T00:00');if(isNaN(d))return v;const o={weekday:'short',month:'short',day:'numeric'};if(long||d.getFullYear()!==today().getFullYear())o.year='numeric';return d.toLocaleDateString(undefined,o)};
function syncField(el){const b=el._cf;if(!b)return;const isSel=el.tagName==='SELECT',o=isSel&&el.options[el.selectedIndex];
  const txt=isSel?(o?o.text:''):(fmtCD(el.value)||'Pick a date');
  b.innerHTML=`<span class="cv">${esc(txt)}</span>${isSel?IC.chev:IC.cal}`;b.setAttribute('aria-label',`${fieldLabel(el)||(isSel?'Choose':'Date')}: ${txt}`)}
function enhance(){
  for(const el of document.querySelectorAll('select:not([data-cf]),input[type=date]:not([data-cf])')){
    el.dataset.cf='1';el.classList.add('nat');el.tabIndex=-1;el.setAttribute('aria-hidden','true');
    const b=document.createElement('button');b.type='button';b.className='cfield '+(el.tagName==='SELECT'?'csel':'cdate');
    b.setAttribute('aria-haspopup',el.tagName==='SELECT'?'listbox':'dialog');b.setAttribute('aria-expanded','false');
    b._nat=el;el._cf=b;el.after(b);syncField(el)}
}
new MutationObserver(enhance).observe(document.body,{childList:true,subtree:true});
document.addEventListener('change',e=>{if(e.target&&e.target._cf)syncField(e.target)},true);
const accOf=b=>{const c=getComputedStyle(b).getPropertyValue('--c').trim()||'#2a63d4';return c};
const commit=(el,v)=>{if(el.value===v)return;el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))};
let pop=null;
function closePop(back){if(!pop)return;const p=pop;pop=null;p.btn.setAttribute('aria-expanded','false');document.body.style.overflow=p.ov;
  p.L.classList.add('out');setTimeout(()=>p.L.remove(),window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches?0:200);
  if(back!==false&&p.btn.isConnected)try{p.btn.focus({preventScroll:true})}catch(e){}}
function openLayer(btn,html,sheet){closePop(false);const L=document.createElement('div');L.className='clayer';const acc=accOf(btn);
  L.style.setProperty('--acc',acc);L.style.setProperty('--onacc',onC(acc));L.innerHTML=`<div class="cbd${sheet?' dim':''}"></div>`+html;document.body.appendChild(L);
  pop={L,btn,ov:document.body.style.overflow};btn.setAttribute('aria-expanded','true');if(sheet)document.body.style.overflow='hidden';
  L.querySelector('.cbd').addEventListener('click',()=>closePop());
  L.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closePop()}});return L}
function openSelect(btn){const el=btn._nat,r=btn.getBoundingClientRect(),vw=innerWidth,vh=innerHeight,opts=[...el.options];
  const L=openLayer(btn,`<div class="cmenu" role="listbox" aria-label="${esc(fieldLabel(el))}">${opts.map((o,i)=>`<button type="button" role="option" data-i="${i}" aria-selected="${o.selected}" style="--i:${Math.min(i,10)}"${o.disabled?' disabled':''}><span>${esc(o.text)}</span>${o.selected?IC.tick:''}</button>`).join('')}</div>`);
  const m=L.querySelector('.cmenu'),w=Math.min(Math.max(r.width,230),vw-16),left=Math.min(Math.max(8,r.left),vw-w-8),below=vh-r.bottom-12,above=r.top-12,want=Math.min(380,opts.length*48+14);
  m.style.width=w+'px';m.style.left=left+'px';
  if(below>=want||below>=above){m.style.top=(r.bottom+6)+'px';m.style.maxHeight=Math.max(150,below)+'px';m.style.transformOrigin='top center'}
  else{m.style.bottom=(vh-r.top+6)+'px';m.style.maxHeight=Math.max(150,above)+'px';m.style.transformOrigin='bottom center';m.style.setProperty('--dy','6px')}
  m.addEventListener('click',e=>{const o=e.target.closest('[role=option]');if(!o||o.disabled)return;haptic(10);const i=+o.dataset.i;
    m.querySelectorAll('[role=option]').forEach(x=>{const on=x===o;x.setAttribute('aria-selected',on);const t=x.querySelector('svg');if(t&&!on)t.remove();if(on&&!t)x.insertAdjacentHTML('beforeend',IC.tick)});
    setTimeout(()=>{closePop();if(el.selectedIndex!==i){el.selectedIndex=i;el.dispatchEvent(new Event('change',{bubbles:true}))}},120)});
  m.addEventListener('keydown',e=>{const all=[...m.querySelectorAll('[role=option]:not(:disabled)')],k=all.indexOf(document.activeElement);
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=all[(k+(e.key==='ArrowDown'?1:-1)+all.length)%all.length];n&&n.focus()}
    if(e.key==='Tab')closePop(false)});
  const cur=m.querySelector('[aria-selected=true]')||m.querySelector('[role=option]');if(cur){cur.scrollIntoView&&cur.scrollIntoView({block:'nearest'});try{cur.focus({preventScroll:true})}catch(e){}}
}
function openCal(btn){const el=btn._nat,min=el.min||'',max=el.max||'',td=iso(today()),logged=new Set(Object.values(S.sessions||{}).map(s=>s&&s.date));
  let sel=el.value||'';const base=new Date((sel||(max&&max<td?max:td))+'T00:00');let y=base.getFullYear(),mo=base.getMonth();
  const clear=el.dataset.clear!=null;
  const L=openLayer(btn,`<div class="csheet" role="dialog" aria-modal="true" aria-label="${esc(fieldLabel(el)||'Choose a date')}"><div class="cgrab"></div>
    <div class="ctop"><div><small>${esc(fieldLabel(el)||'Date')}</small><div class="cbig"></div></div></div>
    <div class="cmrow"><div class="cmon" aria-live="polite"></div><div class="cnav"><button type="button" data-m="-1" aria-label="Previous month">${IC.l}</button><button type="button" data-m="1" aria-label="Next month">${IC.r}</button></div></div>
    <div class="cdow" aria-hidden="true">${['S','M','T','W','T','F','S'].map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="cgw"><div class="cgrid"></div></div>
    <div class="cfoot"><span class="lg"></span>${clear?'<button type="button" data-c="clear">Clear</button>':''}<button type="button" data-c="today">Today</button></div></div>`,true);
  const sh=L.querySelector('.csheet'),grid=()=>L.querySelector('.cgrid');
  const head=()=>{const b=L.querySelector('.cbig');b.textContent=sel?fmtCD(sel,true):'No date';b.classList.toggle('none',!sel)};
  const ok=v=>!(min&&v<min)&&!(max&&v>max);
  function draw(dir){const g=grid(),first=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate();let h='',any=false;
    for(let i=0;i<first;i++)h+='<span></span>';
    for(let d=1;d<=n;d++){const v=iso(new Date(y,mo,d)),has=logged.has(v);any=any||has;
      h+=`<button type="button" class="cday${v===td?' td':''}${v===sel?' on':''}${has?' has':''}" data-v="${v}"${ok(v)?'':' disabled'} aria-label="${esc(fmtCD(v,true))}${has?', workout logged':''}"${v===sel?' aria-pressed="true"':''}>${d}</button>`}
    g.innerHTML=h;g.classList.remove('nx','pv');if(dir){void g.offsetWidth;g.classList.add(dir>0?'nx':'pv')}
    L.querySelector('.cmon').innerHTML=`${MON[mo]} <span>${y}</span>`;
    L.querySelector('.lg').innerHTML=any?'<i></i>Workout logged':'';
    const pm=iso(new Date(y,mo,0)),nm=iso(new Date(y,mo+1,1));
    L.querySelector('[data-m="-1"]').disabled=!!(min&&pm<min);L.querySelector('[data-m="1"]').disabled=!!(max&&nm>max)}
  const shift=k=>{mo+=k;if(mo<0){mo=11;y--}if(mo>11){mo=0;y++}draw(k);haptic(5)};
  const pick=v=>{sel=v;head();grid().querySelectorAll('.cday').forEach(b=>{const on=b.dataset.v===v;b.classList.toggle('on',on);if(on){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}});haptic(12);
    setTimeout(()=>{closePop();commit(el,v)},230)};
  sh.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
    if(b.dataset.m)shift(+b.dataset.m);
    else if(b.dataset.v)pick(b.dataset.v);
    else if(b.dataset.c==='today'){if(!ok(td))return;const t=new Date(td+'T00:00');if(t.getFullYear()!==y||t.getMonth()!==mo){const k=(t.getFullYear()-y)*12+t.getMonth()-mo;y=t.getFullYear();mo=t.getMonth();draw(k)}pick(td)}
    else if(b.dataset.c==='clear'){sel='';head();haptic(8);setTimeout(()=>{closePop();commit(el,'')},150)}});
  let sx=null,sy=0;const gw=L.querySelector('.cgw');
  gw.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
  gw.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){const nb=L.querySelector(`[data-m="${dx<0?1:-1}"]`);if(nb&&!nb.disabled)shift(dx<0?1:-1)}});
  let gy=null;const grab=L.querySelector('.cgrab');sh.addEventListener('pointerdown',e=>{if(e.target===grab||e.target.closest('.ctop'))gy=e.clientY});
  sh.addEventListener('pointerup',e=>{if(gy!=null&&e.clientY-gy>60)closePop();gy=null});
  head();draw(0);
  L.addEventListener('keydown',e=>{const a=document.activeElement;if(!a||!a.classList||!a.classList.contains('cday'))return;const st={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];if(!st)return;e.preventDefault();
    const d=new Date(a.dataset.v+'T00:00');d.setDate(d.getDate()+st);const v=iso(d);if(d.getMonth()!==mo||d.getFullYear()!==y){const k=(d.getFullYear()-y)*12+d.getMonth()-mo;y=d.getFullYear();mo=d.getMonth();draw(k)}const n=L.querySelector(`.cday[data-v="${v}"]`);n&&n.focus()});
  const f=L.querySelector('.cday.on')||L.querySelector('.cday.td')||L.querySelector('.cday:not(:disabled)');try{f&&f.focus({preventScroll:true})}catch(e){}
}
document.addEventListener('click',e=>{const t=e.target;
  const b=t.closest&&t.closest('.cfield');if(b&&b._nat){e.preventDefault();if(pop&&pop.btn===b){closePop();return}(b._nat.tagName==='SELECT'?openSelect:openCal)(b);return}
  const l=t.closest&&t.closest('label[for]');if(l){const n=document.getElementById(l.htmlFor);if(n&&n._cf){e.preventDefault();n._cf.click()}}});
addEventListener('resize',()=>{if(pop&&!pop.L.querySelector('.csheet'))closePop(false)});
addEventListener('scroll',()=>{if(pop&&!pop.L.querySelector('.csheet'))closePop(false)},{passive:true});
enhance();
{const it=document.getElementById('intro');if(it){const end=()=>it.isConnected&&it.remove();it.addEventListener('click',end);it.addEventListener('animationend',e=>{if(e.target===it)end()});setTimeout(end,2200)}}

(async()=>{
  try{
    if(!booting)return;
    const done=()=>{booting=false;render()};
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return done();const uid=await user.id();if(!uid)return done();
    profRef=db.doc('data/users/'+uid+'/profile');mode='db';status='Synced to your account, on every device.';
    const local=JSON.parse(JSON.stringify(S));let gotProf=false,gotSess=false;
    const ready=()=>{if(gotProf&&gotSess&&booting){booting=false}};
    const timer=setTimeout(()=>{if(!loaded){slow=true;booting=false;render()}},10000);
    profRef.onSnapshot(sn=>{if(sn.exists)S.profile=sn.data();else if(!local.profile)S.profile=null;if(!sn.metadata.fromCache)gotProf=true;ready();render()},()=>{gotProf=true;ready();render()});
    profRef.collection('sessions').onSnapshot(q=>{
      const o={};q.docs.forEach(d=>{o[d.id]=d.data()});
      if(!q.metadata.fromCache&&!loaded){loaded=true;slow=false;gotSess=true;clearTimeout(timer);
        if(q.empty&&Object.keys(local.sessions).length){for(const [k,v] of Object.entries(local.sessions)){o[k]=v;profRef.collection('sessions').doc(k).set(v).catch(()=>{})}if(local.profile)profRef.set(local.profile).catch(()=>{})}}
      S.sessions=o;ready();render()},
      ()=>{clearTimeout(timer);mode='local';booting=false;status='Sync unavailable; saving on this device only.';render()});
  }catch(e){booting=false;render()}
})();
}
